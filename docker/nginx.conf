server {
    listen 0.0.0.0:${PORT};
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 20m;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only Laravel's front controller may execute PHP (including uploaded files).
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
    }

    location ~* \.(?:php|phtml|phar)(?:/|$) { return 404; }
    location ~ /\. { return 404; }
    location ~* ^/(?:composer\.(?:json|lock)|artisan|Dockerfile)$ { return 404; }

    # Hashed Vite output is immutable. Existing unversioned JS, PWA workers,
    # manifests and styles must be revalidated after each deployment.
    location ~* ^/build/assets/[^/]+\.(?:js|css)$ {
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 5;
        gzip_types application/javascript text/javascript text/css application/json application/manifest+json;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location ~* \.(?:js|css|json|webmanifest)$ {
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 5;
        gzip_types application/javascript text/javascript text/css application/json application/manifest+json;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
}
